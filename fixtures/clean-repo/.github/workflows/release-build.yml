name: release-build
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: mkdir -p dist && echo "release" > dist/release.txt
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
