name: issue-env-agent
on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      ISSUE_TITLE: ${{ github.event.issue.title }}
    steps:
      - name: Codex draft
        uses: openai/codex-action@v1
        with:
          prompt: "Draft a reply for the issue"
