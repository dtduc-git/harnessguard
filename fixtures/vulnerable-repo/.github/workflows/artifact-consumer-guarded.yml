name: artifact-consumer-guarded
on:
  workflow_run:
    workflows: [artifact-producer]
    types: [completed]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download build output from the triggering run
        uses: actions/download-artifact@v4
        with:
          name: build-output
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: bash scripts/publish.sh
