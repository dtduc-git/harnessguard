name: reusable-agent
on:
  workflow_call:
    secrets:
      DEPLOY_KEY:
        required: false

permissions:
  contents: read

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Draft reply with the agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.DEPLOY_KEY }}
          prompt: "Draft a reply for the maintainer to review"
          claude_args: '--allowedTools "Read"'
