id: HG001
title: Agent step on untrusted events with secrets in scope
severity: critical
check: secrets_untrusted_event
owasp: "ASI01 Agent Goal Hijack / ASI03 Identity & Privilege Abuse"
description: >
  Microsoft's Agents Rule of Two: a workflow must never combine untrusted
  input, privileged access, and external communication. An agent that processes
  attacker-controlled event content (issue body, PR title, comment) while
  runner secrets are in scope can be instructed to read and exfiltrate them.
  Real-world: "Comment and Control" (April 2026) leaked ANTHROPIC_API_KEY,
  GEMINI_API_KEY and GITHUB_TOKEN from Claude Code, Gemini CLI and Copilot
  agent workflows (Black Hat USA 2026 follow-up).
remediation: >
  Do not expose secrets to workflows triggered by issues, comments or fork
  pull requests. Run the agent in a secret-free job, or move privileged work
  behind workflow_run / workflow_dispatch after human review.
params:
  guard_downgrade: true
