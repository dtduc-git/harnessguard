id: HG007
title: Privileged workflow_run job consumes artifacts from untrusted workflows
severity: high
check: artifact_trust_chain
owasp: "ASI04 Agentic Supply Chain Vulnerabilities / ASI03 Identity & Privilege Abuse"
description: >
  Cordyceps (Novee, June 2026): a workflow triggered by attacker-controlled
  input (pull_request, issues, comments) uploads an artifact; a second workflow
  triggered by workflow_run downloads that artifact while holding secrets,
  write permissions or OIDC tokens. Neither file is exploitable alone — the
  risk lives in the composition, which per-file scanners do not see. The
  original research flagged 654 repositories and confirmed 300+ fully
  exploitable at Microsoft, Google, Apache, Cloudflare and the PSF.
remediation: >
  Treat artifacts produced by untrusted-triggered workflows as attacker
  content: verify the producing run (actor association, head repository) in a
  read-only job first, download with an explicit run-id, check digests, and
  never execute artifact code in a job that holds secrets or write
  permissions. Prefer pull_request over pull_request_target for untrusted
  contributions.
params:
  environment_downgrade: true
