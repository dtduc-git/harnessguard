name: Cursor Agent Auto Ship

# Cloud-agent GitHub integrations (Cursor Cloud, ManagePullRequest, gh pr edit)
# cannot update pull requests, add labels, approve, or merge — they return:
#   GraphQL: Resource not accessible by integration (updatePullRequest)
#
# This workflow ships eligible PRs from cursor/** branches using GH_PAT / GITHUB_TOKEN
# inside Actions (pull-requests: write). Agents only need git push; no PR API calls.
#
# Triggers:
#   - pull_request_target: cursor/** branches when not draft (or after mark-ready job)
#   - issue_comment: /ship from repo OWNER/MEMBER/COLLABORATOR (manual fallback)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  cursor-mark-ready:
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft &&
      startsWith(github.event.pull_request.head.ref, 'cursor/')
    runs-on: ubuntu-latest
    steps:
      - name: Mark draft PR ready for review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || github.token }}
          script: |
            await github.graphql(
              `mutation($id: ID!) {
                markPullRequestReadyForReview(input: { pullRequestId: $id }) {
                  pullRequest { number isDraft }
                }
              }`,
              { id: context.payload.pull_request.node_id }
            );

  cursor-auto-ship:
    if: >
      github.event_name == 'pull_request_target' &&
      !github.event.pull_request.draft &&
      startsWith(github.event.pull_request.head.ref, 'cursor/')
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate low-risk eligibility
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const allowed = [
              /^\.github\/workflows\/[^/]+\.yml$/,
              /^scripts\/clickup-drift-task\.js$/,
              /^scripts\/[^/]+\.(sh|py)$/,
              /^\.cursor\/commands\/[^/]+\.md$/,
              /^\.cursor\/Dockerfile$/,
              /^\.cursor\/environment\.json$/,
              /^\.cursor\/install\.sh$/,
              /^automation\/cursor-team-playwright\/.+/,
              /^cursor-team\/manifest\.json$/,
              /^AGENTS\.md$/,
              /^README\.md$/,
              /^docs\/.+/,
              /^\.cursor\/rules\/.+\.mdc$/,
              /^\.governance\/versions\.json$/,
              /^VERSION$/,
              /^requirements-docs\.txt$/,
              /^wrangler\.jsonc$/,
              /^\.gitignore$/,
            ];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const changed = files.map((f) => f.filename);
            const disallowed = changed.filter((file) => !allowed.some((r) => r.test(file)));

            core.setOutput("eligible", disallowed.length === 0 ? "true" : "false");
            core.setOutput("disallowed_files", disallowed.join(", "));

      - name: Comment when outside low-risk scope
        if: steps.gate.outputs.eligible != 'true'
        env:
          DISALLOWED_FILES: ${{ steps.gate.outputs.disallowed_files }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || github.token }}
          script: |
            const disallowed = process.env.DISALLOWED_FILES || "(none reported)";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body:
                "Cursor Agent Auto Ship skipped: files outside approved low-risk scope.\n\n" +
                `Disallowed: ${disallowed}`,
            });

      - name: Resolve unresolved review threads
        if: steps.gate.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = context.payload.pull_request.number;

            const query = `
              query($owner: String!, $repo: String!, $number: Int!, $after: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 100, after: $after) {
                      nodes { id isResolved }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }`;
            const mutation = `
              mutation($threadId: ID!) {
                resolveReviewThread(input: { threadId: $threadId }) {
                  thread { id isResolved }
                }
              }`;

            let after = null;
            const unresolvedIds = [];
            do {
              const res = await github.graphql(query, { owner, repo, number, after });
              const threads = res.repository.pullRequest.reviewThreads;
              for (const t of threads.nodes) {
                if (!t.isResolved) unresolvedIds.push(t.id);
              }
              after = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
            } while (after);

            for (const threadId of unresolvedIds) {
              await github.graphql(mutation, { threadId });
            }

      - name: Approve eligible cursor-agent PR
        if: steps.gate.outputs.eligible == 'true'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GH_PAT || github.token }}
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: "APPROVE",
              body:
                "Auto-approved by Cursor Agent Auto Ship. " +
                "Eligible low-risk change on a cursor/** branch.",
            });

      - name: Squash merge when checks pass
        if: steps.gate.outputs.eligible == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set +e
          echo "Waiting for required checks (up to 15 min)..."
          gh pr checks "$PR_URL" --watch --interval 30 --fail-fast
          CHECK_EXIT=$?
          if [ "$CHECK_EXIT" -ne 0 ]; then
            echo "Checks not all green yet — merge deferred until next synchronize or /ship."
            exit 0
          fi
          if gh pr merge "$PR_URL" --auto --squash 2>/dev/null; then
            echo "Auto-merge enabled; merge queued when checks pass."
          elif gh pr merge "$PR_URL" --squash 2>/dev/null; then
            echo "Direct squash merge completed."
          else
            echo "Merge deferred — branch protection or manual merge required. Comment /ship to retry."
            exit 0
          fi

  comment-ship:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/ship') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    steps:
      - name: Squash merge from /ship comment
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --squash --admin
